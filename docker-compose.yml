version: '3.8'

services:
  # Database for storing dynamic orders and geometry
  db:
    image: postgis/postgis:15-3.3
    container_name: route_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: routing_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # OSRM Backend - BEIJING
  osrm_beijing:
    image: osrm/osrm-backend
    container_name: route_osrm_beijing
    volumes:
      - ./data:/data
    command: "osrm-routed --algorithm mld /data/Beijing.osrm"

  # OSRM Backend - COLOMBO
  osrm_colombo:
    image: osrm/osrm-backend
    container_name: route_osrm_colombo
    volumes:
      - ./data:/data
    command: "osrm-routed --algorithm mld /data/sri-lanka-latest.osrm"

  # VROOM Backend - BEIJING
  vroom_beijing:
    image: ghcr.io/vroom-project/vroom-docker:latest
    container_name: route_vroom_beijing
    environment:
      - VROOM_ROUTER=osrm
    volumes:
      - ./vroom-beijing-conf:/conf
    depends_on:
      - osrm_beijing

  # VROOM Backend - COLOMBO
  vroom_colombo:
    image: ghcr.io/vroom-project/vroom-docker:latest
    container_name: route_vroom_colombo
    environment:
      - VROOM_ROUTER=osrm
    volumes:
      - ./vroom-colombo-conf:/conf
    depends_on:
      - osrm_colombo

  # FastAPI Microservice (Host Bridge and UI)
  api:
    build: ./api
    container_name: route_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=routing_db
      - DB_HOST=db
      - DB_PORT=5432
      - VROOM_BEIJING_URL=http://vroom_beijing:3000
      - VROOM_COLOMBO_URL=http://vroom_colombo:3000
    depends_on:
      - db
      - vroom_beijing
      - vroom_colombo

volumes:
  pgdata:
